# ===========================================================================
# Grafioschtrader user settings (Docker)
# ===========================================================================
# This file is mounted into the backend container and can override any
# property from the built-in application.properties:
#   https://github.com/grafioschtrader/grafioschtrader/blob/master/backend/grafioschtrader-server/src/main/resources/application.properties
#
# Apply changes with:  docker compose restart backend
#
# This file lives on YOUR machine — image updates never touch it.
#
# NOTE: The following are supplied by docker-compose from .env as environment
# variables and CANNOT be overridden here (environment variables always win):
# database connection, JWT secret, mail/SMTP, admin email, allowed users,
# Java memory and the HTTP/AJP connector settings. Change those in .env.
# ===========================================================================

# ---------------------------------------------------------------------------
# Scheduled tasks — cron format with seconds, times are in UTC!
# ---------------------------------------------------------------------------
# The price and dividend jobs fetch from free, public data providers. Every
# installation ships with the same default times, so unchanged they would all
# query those providers in the same minute. install.sh and update.sh therefore
# move the whole morning chain to a random slot between 05:00 and 08:00 of THIS
# host's local time (written here as UTC) — but only while all five properties
# below are still at their defaults. Change one of them and the automatic
# adjustment stops for good; your schedule is then yours to maintain. Keep the
# order and the spacing: the standing orders need the closing prices of the
# price run, and the two checks report on what the jobs before them wrote.

# End-of-day price update (default 05:54 UTC, after most exchanges close)
#gt.eod.cron.quotation=0 54 05 * * ?

# Dividend data update (default 06:00 UTC)
#gt.dividend.update.data=0 0 06 * * ?

# Standing order execution, needs the closing prices above (default 06:15 UTC)
#gt.standing.order.execution=0 15 06 * * ?
# Inactive instruments and missing dividends (default 06:30 UTC)
#gt.check.inactive.dividend=0 30 06 * * ?
# hold_* tables compared against the transactions (default 06:45 UTC)
#gt.hold.consistency.check=0 45 06 * * ?

# Trading calendar update (default Sunday 12:00 UTC)
#gt.calendar.update.index=0 0 12 * * SUN
# Rule-based trading calendar update (default Sunday 12:30 UTC)
#gt.calendar.update.ruleset=0 30 12 * * SUN

# Further task properties (see built-in application.properties):
# gt.load.ecb.data, gt.eod.cron.monitor.quotation,
# gt.intraday.cron.monitor.quotation, gt.algo.alarm.indicator.evaluation, ...

