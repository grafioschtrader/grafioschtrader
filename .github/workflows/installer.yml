name: Installer checks
on:
  push:
    paths:
      - 'util/installer/**'
      - 'util/shellscripts/**'
      - '.github/workflows/installer.yml'
      - 'backend/grafiosch-server-base/src/main/java/grafiosch/installer/**'
      - 'backend/grafiosch-test-integration/src/test/java/grafiosch/installer/**'
      - 'backend/grafiosch-server-base/src/main/java/grafiosch/service/LoginAttemptServiceIpAddress.java'
      - 'backend/grafiosch-server-base/src/main/java/grafiosch/security/filter/StatelessLoginFilter.java'
      - 'backend/grafiosch-test-integration/src/test/java/grafiosch/service/Login*'
      - 'backend/grafioschtrader-server/src/main/java/grafioschtrader/security/filter/SecurityGTConfig.java'
      - 'backend/grafiosch-test-integration/src/main/java/grafiosch/integration/security/SecurityIntegrationConfig.java'
      - 'backend/grafioschtrader-server/src/main/resources/application.properties'
      - 'backend/grafioschtrader-server/src/main/resources/application.yaml'
      - 'backend/grafiosch-test-integration/src/main/resources/application.properties'
      - 'docker/docker-compose.yml'
      - 'docker/Caddyfile'
  pull_request:
    paths:
      - 'util/installer/**'
      - 'util/shellscripts/**'
      - '.github/workflows/installer.yml'
      - 'backend/grafiosch-server-base/src/main/java/grafiosch/installer/**'
      - 'backend/grafiosch-test-integration/src/test/java/grafiosch/installer/**'
      - 'backend/grafiosch-server-base/src/main/java/grafiosch/service/LoginAttemptServiceIpAddress.java'
      - 'backend/grafiosch-server-base/src/main/java/grafiosch/security/filter/StatelessLoginFilter.java'
      - 'backend/grafiosch-test-integration/src/test/java/grafiosch/service/Login*'
      - 'backend/grafioschtrader-server/src/main/java/grafioschtrader/security/filter/SecurityGTConfig.java'
      - 'backend/grafiosch-test-integration/src/main/java/grafiosch/integration/security/SecurityIntegrationConfig.java'
      - 'backend/grafioschtrader-server/src/main/resources/application.properties'
      - 'backend/grafioschtrader-server/src/main/resources/application.yaml'
      - 'backend/grafiosch-test-integration/src/main/resources/application.properties'
      - 'docker/docker-compose.yml'
      - 'docker/Caddyfile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the standalone installer and reject drift
        run: |
          bash util/installer/build.sh
          git diff --exit-code -- util/installer/gt-install.sh
      - name: Check bundling and compile extracted Python helpers
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s util/installer/test -p test_build.py
  shell:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck openssl mariadb-client
      - name: Check scripts, inventory, planning, and update failures
        run: bash util/installer/test/check-shell.sh
      - name: Check root-owned answers and modeless bootstrap
        run: sudo bats util/installer/test/credentials.bats util/installer/test/core.bats util/installer/test/bootstrap.bats
      - name: Check hidden terminal input and cancellation
        run: python3 util/installer/test/secret-terminal.py
  core:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check planned base packages in a fresh distribution container
        run: docker run --rm -v "$PWD:/repo:ro" ubuntu:24.04 bash /repo/util/installer/test/base-packages-container.sh
      - name: Build disposable core test environment
        run: docker build -t gt-installer-core - < util/installer/test/core.Dockerfile
      - name: Check real MariaDB, encryption and interruption recovery
        run: docker run --rm -v "$PWD:/repo:ro" gt-installer-core bash util/installer/test/core-container.sh
  toolchains:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build disposable host with an existing Java 17
        run: docker build -t gt-installer-toolchains - < util/installer/test/toolchains.Dockerfile
      - name: Check APT installation, Java selection and interruption recovery
        run: docker run --rm -v "$PWD:/repo:ro" gt-installer-toolchains bash util/installer/test/toolchains-container.sh
      - name: Build disposable Debian 12 host without an APT JDK 25
        run: docker build -t gt-installer-toolchains-archive - < util/installer/test/toolchains-archive.Dockerfile
      - name: Check Temurin archive with APT Maven, interrupted extraction and unchanged alternatives
        run: docker run --rm -e GT_TEST_MAVEN=apt -v "$PWD:/repo:ro" gt-installer-toolchains-archive bash util/installer/test/toolchains-archive-container.sh
      - name: Check Temurin and Apache Maven archives as needed on Debian 11
        run: docker run --rm -e GT_TEST_MAVEN=archive -v "$PWD:/repo:ro" gt-installer-toolchains-archive bash util/installer/test/toolchains-archive-container.sh
  node:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build disposable build-tool environment
        run: docker build -t gt-installer-node - < util/installer/test/core.Dockerfile
      - name: Check isolated Node, npm tools and interruption recovery
        run: docker run --rm -v "$PWD:/repo:ro" gt-installer-node bash util/installer/test/node-container.sh
  application:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build disposable application configuration environment
        run: docker build -t gt-installer-app - < util/installer/test/app.Dockerfile
      - name: Check application recovery and privileged files
        run: docker run --rm -v "$PWD:/repo:ro" gt-installer-app bats util/installer/test/app.bats
      - name: Validate real unit, sudoers, logrotation and cron configuration
        run: docker run --rm -v "$PWD:/repo:ro" gt-installer-app bash util/installer/test/app-container.sh
  web:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build disposable web and mail environment
        run: docker build -t gt-installer-web - < util/installer/test/web.Dockerfile
      - name: Check web ownership, routing and rollback
        run: docker run --rm -v "$PWD:/repo:ro" gt-installer-web bats util/installer/test/web.bats
      - name: Verify real nginx and HTTP integration
        run: docker run --rm -v "$PWD:/repo:ro" gt-installer-web bash util/installer/test/web-container.sh
      - name: Check domain and mail recovery rules
        run: docker run --rm -v "$PWD:/repo:ro" gt-installer-web bats util/installer/test/domain-mail.bats util/installer/test/certbot-reuse.bats
      - name: Verify local SMTP transports and authentication
        run: docker run --rm -v "$PWD:/repo:ro" gt-installer-web bash util/installer/test/mail-container.sh
  mail-application:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test mail configuration and login lockout without a database
        run: mvn -B -ntp -f backend/pom.xml -pl grafiosch-test-integration -am package -Dtest=InstallerMailConfigurationTest,LoginAttemptServiceIpAddressTest -Dsurefire.failIfNoSpecifiedTests=false
      - name: Build disposable Java and SMTP environment
        run: docker build -t gt-installer-mail-application - < util/installer/test/mail-application.Dockerfile
      - name: Verify deployed JAR configuration and SMTP with disposable credentials
        run: docker run --rm -v "$PWD:/repo:ro" gt-installer-mail-application bash util/installer/test/mail-application-container.sh
      - name: Verify separate login counters through the deployment Caddy configuration
        run: bash util/installer/test/login-proxy-host.sh
  domain:
    needs: bundle
    runs-on: ubuntu-latest
    strategy:
      matrix:
        web: [nginx, apache2]
    steps:
      - uses: actions/checkout@v4
      - name: Build disposable domain environment
        run: docker build -t gt-installer-domain-test - < util/installer/test/web.Dockerfile
      - name: Verify existing certificate and rollback
        run: docker run --rm -v "$PWD:/repo:ro" gt-installer-domain-test bash util/installer/test/domain-container.sh ${{ matrix.web }}
      - name: Verify external proxy headers and source restriction
        run: docker run --rm -v "$PWD:/repo:ro" gt-installer-domain-test bash util/installer/test/domain-container.sh ${{ matrix.web }} proxy
      - name: Verify actual HTTP-01 issuance and renewal against local Pebble
        run: bash util/installer/test/acme-host.sh ${{ matrix.web }}
