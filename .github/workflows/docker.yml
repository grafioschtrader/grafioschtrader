name: Docker images

# A published release is the single trigger: tagging and publishing a release
# both happen for every GT release, so reacting to the tag push as well would
# start a second, concurrent run pushing the identical tags and writing the same
# build cache scopes. workflow_dispatch remains as the manual escape hatch.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: grafioschtrader-backend
            dockerfile: docker/backend.Dockerfile
          - image: grafioschtrader-web
            dockerfile: docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Determine version and image name
        id: meta
        run: |
          version=$(mvn -q -f backend/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.image }}:latest
          # image.source is what makes GHCR link the package to this repository,
          # which in turn lets the package inherit the repository's access
          # settings instead of staying an unconnected private package.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # A GHCR package is private when first published, which makes even an
      # anonymous `docker compose pull` fail with "unauthorized" for every tag —
      # so a private package silently breaks installation and updates for all
      # users. These images are meant to be public, so enforce that on every
      # publish instead of relying on a one-time manual setting.
      #
      # The visibility endpoint is not part of the documented Packages REST API
      # and may reject GITHUB_TOKEN, so a failure must not fail the publish: the
      # images are already pushed at this point. The warning then names the
      # manual fallback.
      - name: Ensure the package is publicly pullable
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pkg="${{ matrix.image }}"
          owner="${{ steps.meta.outputs.owner }}"
          if gh api --method PATCH \
               "/orgs/$owner/packages/container/$pkg/visibility" \
               -f visibility=public; then
            echo "::notice::$pkg is public"
          else
            echo "::warning::Could not set $pkg public automatically. Do it once by hand:"
            echo "::warning::https://github.com/orgs/$owner/packages/container/package/$pkg -> Package settings -> Change visibility -> Public"
          fi
          # Report what anonymous clients actually see, so the log answers
          # "can users pull this?" without needing registry knowledge.
          if curl -sf "https://ghcr.io/token?service=ghcr.io&scope=repository:$owner/$pkg:pull" >/dev/null; then
            echo "::notice::anonymous pull of $pkg works"
          else
            echo "::error::$pkg is still not anonymously pullable — installs and updates will fail with 'unauthorized'"
          fi
