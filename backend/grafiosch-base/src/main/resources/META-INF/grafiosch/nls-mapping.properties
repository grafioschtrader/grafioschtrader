# NLS key-mapping descriptor of the grafiosch-base module -- see GitHub issue #214.
#
# Every module on the classpath may ship one file under this exact resource path. NlsMappingRegistry
# reads ALL of them via ClassLoader.getResources() and unions the values, which is how the
# grafioschtrader application extends the contract without grafiosch-base knowing about it.
#
# Deliberately NOT wired to BaseConstants.PREFIXES_PARAM: that set is filled from a @PostConstruct
# (GTStartUp.started()), so a plain JUnit guard -- which never boots Spring -- would compute a
# different mapping than the running server and would validate a contract nobody enforces.
#
# passthrough.prefixes  Keys with one of these prefixes are delivered to the client verbatim.
# nested.namespaces     Keys whose first dot-segment is one of these become a one-level object.

# "gt." is listed here even though the application layer owns that prefix (see backend/CLAUDE.md),
# because grafiosch-base itself still ships ~20 gt.* keys (gt.afterEqual, gt.input.rule.*,
# gt.gtnet.* ...). Were the prefix declared only by grafioschtrader-common, those keys would map to
# gt.input.rule.min.violation in the full application but to GT_INPUT_RULE_MIN_VIOLATION in a
# library-only deployment -- the same key mapping two ways depending on what happens to be on the
# class path. Migrating those keys to "g." is tracked in issue #75; until then this keeps the
# mapping deployment-independent. The union with the application descriptor is idempotent.
passthrough.prefixes = g.,gt.,UDF_
nested.namespaces = GT_FILTER
