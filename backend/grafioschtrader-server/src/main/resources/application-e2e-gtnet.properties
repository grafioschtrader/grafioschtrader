#-------------------------------------------------------------------------------------------------
#   Determinism layer of the two application GTNet peers
#-------------------------------------------------------------------------------------------------
# Combine with the e2e profile, and for the second peer additionally with e2e-peer:
#   peer A: mvn -pl grafioschtrader-server spring-boot:test-run -Dspring-boot.run.profiles=e2e,e2e-gtnet
#   peer B: mvn -pl grafioschtrader-server spring-boot:test-run -Dspring-boot.run.profiles=e2e,e2e-gtnet,e2e-peer
#
# test-run rather than run, because only test-run puts src/test/resources on the classpath, where Flyway finds
# db/migration/test. The plain e2e profile stays untouched so the ordinary main suite keeps its schedules.

# A second application JVM cannot start while the first holds the AJP connector. GrafioschtraderApplication adds it
# unconditionally when the flag is true and binds it to 127.0.0.1:9090, so the peers switch it off entirely.
gt.connector.ajp.enabled=false

# Tasks are executed through the e2e-only admin trigger, never by the 15 second poll of the background worker.
g.background.worker.enabled=false

# GTNet schedules. gt.gtnet.exchange.sync.cron is the one without an inline @Scheduled default, so pinning it here
# is what actually keeps a sync from starting on its own.
g.gnet.future.message.cron=-
g.gnet.log.aggregation.cron=-
gt.gtnet.exchange.sync.cron=-

# Price, calendar and housekeeping schedules. Last-price and history-quote exchange must run against the controlled
# fixture rows on both sides rather than race a connector or QuoteBackgroundUpdateWorker.
gt.eod.cron.quotation=-
gt.eod.cron.monitor.quotation=-
gt.intraday.cron.monitor.quotation=-
gt.dividend.update.data=-
gt.check.inactive.dividend=-
gt.load.ecb.data=-
gt.calendar.update.index=-
gt.calendar.update.ruleset=-
gt.standing.order.execution=-
gt.hold.consistency.check=-
gt.algo.alarm.indicator.evaluation=-
gt.demo.account.tenant.copy=-
gt.user0.persists.filds=-

# History is loaded synchronously, so a test observes the result of its own request instead of a background thread.
gt.security.async.historyquotes=false

# The peers identify each other by a non-loopback literal IPv4 over http (scripts/gtnet-peer-address.mjs), and the
# synthetic peers of the wire tests use reserved documentation names. Pinned here so that tightening the production
# default to routable https addresses cannot silently break the two-peer suites.
g.gnet.allow.private.peers=true
