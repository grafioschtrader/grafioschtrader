#-------------------------------------------------------------------------------------------------
#   Second application GTNet peer
#-------------------------------------------------------------------------------------------------
# Only what makes this JVM the second peer: its own port and its own database. Everything that makes a peer
# deterministic lives in application-e2e-gtnet.properties, which both peers load.
#
#   mvn -pl grafioschtrader-server spring-boot:test-run -Dspring-boot.run.profiles=e2e,e2e-gtnet,e2e-peer
#
# grafioschtrader-server declares no server.port at all, so the application runs on the Spring default 8080.
# gt.connector.http.port is inert while gt.connector.http.enabled is false, which makes server.port the only lever.
server.port=8082

spring.datasource.url=jdbc:mariadb://localhost:3306/grafioschtrader_t1
spring.datasource.username=grafioschtrader_t1
spring.datasource.password=grafioschtrader_t1
