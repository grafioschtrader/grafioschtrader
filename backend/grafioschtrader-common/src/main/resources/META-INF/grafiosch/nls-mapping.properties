# NLS key-mapping descriptor of the grafioschtrader-common module -- see GitHub issue #214.
#
# Extends the contract declared by grafiosch-base (same resource path, values are unioned by
# NlsMappingRegistry). The application layer owns the "gt." prefix, mirroring the g. / gt. rule
# documented in backend/CLAUDE.md, which is why "gt.net" stays dotted and does not collide with the
# frontend key GT_NET.

passthrough.prefixes = gt.
