#-------------------------------------
#       T E S T environment
#-------------------------------------

# ============================================================
# Attention: Annotate test class with @ActiveProfiles("test"),
# or use @GrafioschIntegrationTestContext which already does.
# Without the profile the application falls back to
# application.properties and its developer database "grafiosch".
# ============================================================

spring.datasource.url = jdbc:mariadb://localhost:3306/grafiosch_t
spring.datasource.username = grafiosch_t
spring.datasource.password = grafiosch_t


# FLYWAY (FlywayProperties)
#-------------------------------------
# Same portable baseline the e2e profile uses. The filesystem location is resolved against the JVM
# working directory, which surefire sets to this module's basedir, so the relative path holds for
# "mvn test" just as it does for "spring-boot:run".
spring.flyway.enabled=true
spring.flyway.locations=filesystem:./migration-baseline
# Without this a moved or mistyped location applies zero migrations, leaves an empty schema behind and
# only surfaces much later as "Table 'grafiosch_t.<something>' doesn't exist".
spring.flyway.fail-on-missing-locations=true
spring.flyway.baseline-on-migrate=false
# V0_10_0__init.sql is a regenerated snapshot produced by scripts/export-grafiosch-baseline.mjs (called
# through backend/g.bat), so its checksum legitimately changes. Skip validation to avoid spurious
# failures against a persisted grafiosch_t.
spring.flyway.validate-on-migrate=false
spring.jpa.hibernate.ddl-auto=none


# GreenMail in-process SMTP server (port 3025 is GreenMail's default for tests)
#-------------------------------------
# The registration flow of UserResourceTest sends a verification mail, so the suite must not depend on
# an externally running MailHog/Mailpit. Use a placeholder sender address that is still a valid email
# and disable SMTP AUTH, which GreenMail is started without.
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=noreply@test.local
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.enable=false


# Limit Data
#-------------------------------------
# Bandwidth limits would make the repeated requests of a test run look like an abuse
g.limit.request=false
gt.limit.request=false
