# Portable grafiosch-base / grafiosch-server-base browser-test host.
# Start with: mvn -pl grafiosch-test-integration spring-boot:run -Dspring-boot.run.profiles=e2e

server.port=8081

spring.datasource.url=jdbc:mariadb://localhost:3306/grafiosch_t
spring.datasource.username=grafiosch_t
spring.datasource.password=grafiosch_t

# Apply the integration module's portable schema baseline and compatibility migrations.
# The filesystem location is resolved against the JVM working directory, which spring-boot:run sets to
# this module's basedir (backend/grafiosch-test-integration) — no matter from which directory mvn was
# started. See the <workingDirectory> in this module's pom.xml.
spring.flyway.enabled=true
spring.flyway.locations=filesystem:./migration-baseline
# Without this a moved or mistyped location applies zero migrations, leaves an empty schema behind and
# only surfaces much later as "Table 'grafiosch_t.<something>' doesn't exist".
spring.flyway.fail-on-missing-locations=true
spring.flyway.baseline-on-migrate=false
# V0_10_0__init.sql is a regenerated snapshot produced by generate-grafioschbase-sql.bat, so its
# checksum legitimately changes. Skip validation to avoid spurious failures against a persisted
# grafiosch_t.
spring.flyway.validate-on-migrate=false
spring.jpa.hibernate.ddl-auto=none

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=noreply@test.local
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.enable=false

gt.limit.request=false
