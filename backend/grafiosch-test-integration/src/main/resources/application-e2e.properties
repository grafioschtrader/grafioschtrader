# Portable grafiosch-base / grafiosch-server-base browser-test host.
# Start with: mvn -pl grafiosch-test-integration spring-boot:run -Dspring-boot.run.profiles=e2e

server.port=8081

spring.datasource.url=jdbc:mariadb://localhost:3306/grafiosch_t
spring.datasource.username=grafiosch_t
spring.datasource.password=grafiosch_t

# Apply the integration module's portable schema baseline and compatibility migrations.
# The filesystem location is resolved from backend/, matching the documented Maven command.
spring.flyway.enabled=true
spring.flyway.locations=filesystem:./grafiosch-test-integration/migration-baseline
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=none

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=noreply@test.local
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.enable=false

gt.limit.request=false
