# Portable grafiosch-base / grafiosch-server-base browser-test host.
# Start with: mvn -pl grafiosch-test-integration spring-boot:run -Dspring-boot.run.profiles=e2e
#
# The portable browser host uses its own database and disables asynchronous task/GTNet scheduling so test phases can
# invoke task implementations deterministically. Port 8081, the Flyway baseline in ./migration-baseline,
# ddl-auto=none, the MailHog/Mailpit SMTP settings and gt.limit.request are inherited from application.properties.
spring.datasource.url=jdbc:mariadb://localhost:3306/grafiosch_t
spring.datasource.username=grafiosch_t
spring.datasource.password=grafiosch_t

# Keep the two-peer suite deterministic. Individual tasks are executed through the e2e-only admin trigger.
g.background.worker.enabled=false
gt.gtnet.future.message.cron=-
gt.gtnet.log.aggregation.cron=-
gt.gtnet.exchange.sync.cron=-

# The peers identify each other by a non-loopback literal IPv4 over http (scripts/gtnet-peer-address.mjs), and the
# synthetic peers of the wire tests use reserved documentation names. Pinned here so that tightening the production
# default to routable https addresses cannot silently break the two-peer suites.
g.gnet.allow.private.peers=true
