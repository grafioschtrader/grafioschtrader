spring.application.name=grafiosch-integration-host
spring.config.import=optional:classpath:grafiosch-application.properties
spring.main.allow-circular-references=true

# Actuator info endpoint
#-------------------------------------
# The reusable ActuatorService of the frontend library calls /api/actuator/info, and both the login and the
# registration screen build their form only after that call has emitted. Without the base path and the exposure below
# the endpoint answers 404, the combineLatest in those components never emits and the pages stay empty - which is why
# every application on these libraries has to configure the actuator the same way.
management.endpoints.web.exposure.include=info
management.endpoints.web.base-path=/api/actuator
management.info.env.enabled=true

# Values behind /api/actuator/info; filtered by Maven from the module's pom.
info.name=@project.name@
info.description=@project.description@
info.version=@project.version@

# Default developer database. The portable browser suite uses application-e2e.properties instead.
spring.datasource.url=jdbc:mariadb://localhost/grafiosch
spring.datasource.username=grafiosch
spring.datasource.password=grafiosch
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

gt.allowed.users=20
gt.demo.account.pattern.de=^demo-de@.*$
gt.demo.account.pattern.en=^demo-en@.*$
gt.jwt.secret=grafiosch-integration-host-secret-key-change-me
gt.limit.request=false
gt.main.user.admin.mail=admin@test.local

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=noreply@test.local
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.enable=false
