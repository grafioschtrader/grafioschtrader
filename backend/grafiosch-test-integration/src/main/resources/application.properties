spring.application.name=grafiosch-integration-host
spring.config.import=optional:classpath:grafiosch-application.properties
spring.main.allow-circular-references=true

# Actuator info endpoint
#-------------------------------------
# The reusable ActuatorService of the frontend library calls /api/actuator/info, and both the login and the
# registration screen build their form only after that call has emitted. Without the base path and the exposure below
# the endpoint answers 404, the combineLatest in those components never emits and the pages stay empty - which is why
# every application on these libraries has to configure the actuator the same way.
management.endpoints.web.exposure.include=info
management.endpoints.web.base-path=/api/actuator
management.info.env.enabled=true

# Values behind /api/actuator/info; filtered by Maven from the module's pom.
info.name=@project.name@
info.description=@project.description@
info.version=@project.version@

# The port is the same for both profiles: proxy.grafiosch-host.conf.json of the Angular project
# grafiosch-host targets 8081, and the default 8080 would collide with a running Grafioschtrader backend.
server.port=8081

# Default developer database. The portable browser suite uses application-e2e.properties instead.
spring.datasource.url=jdbc:mariadb://localhost/grafiosch
spring.datasource.username=grafiosch
spring.datasource.password=grafiosch
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# FLYWAY (FlywayProperties)
#-------------------------------------
# Not profile specific: both databases are built from the same portable baseline - the default profile
# migrates `grafiosch`, the e2e profile `grafiosch_t`. This mirrors Grafioschtrader, where `grafioschtrader`
# and `grafioschtrader_t` share one migration directory; the only difference is that this baseline lives
# outside src/main/resources, so the location has to be named explicitly.
# The filesystem location is resolved against the JVM working directory, which is this module's basedir:
# spring-boot:run pins it via <workingDirectory> in the pom, an IDE launch uses the project directory.
spring.flyway.enabled=true
spring.flyway.locations=filesystem:./migration-baseline
# Without this a moved or mistyped location applies zero migrations, leaves an empty schema behind and
# only surfaces much later as "Table '<database>.<something>' doesn't exist".
spring.flyway.fail-on-missing-locations=true
# Not baseline-on-migrate=true: Flyway's default baseline version is 1 and every migration here is 0.10.x,
# so all of them would be skipped and a stale schema would silently survive.
spring.flyway.baseline-on-migrate=false
# V0_10_0__init.sql is a regenerated snapshot produced by scripts/export-grafiosch-baseline.mjs (called
# through backend/g.bat), so its checksum legitimately changes. Skip validation to avoid spurious failures
# against a persisted database.
spring.flyway.validate-on-migrate=false
spring.jpa.hibernate.ddl-auto=none

g.allowed.users=20
g.demo.account.pattern.de=^demo-de@.*$
g.demo.account.pattern.en=^demo-en@.*$
g.jwt.secret=grafiosch-integration-host-secret-key-change-me
gt.limit.request=false
g.main.user.admin.mail=admin@test.local

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=noreply@test.local
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.enable=false
