# Profile to dump the shared-base schema from the JPA model. Hibernate creates the
# schema; SchemaGenExitRunner then exits the application so the schema can be
# mysqldump'ed and cleaned up. Currently unused: scripts/export-grafiosch-baseline.mjs
# builds the baseline with mysqldump against the live `grafioschtrader` database
# and never activates this profile. It does read the entity sources to derive the
# table list, but it never starts an application context.

# ddl-auto=create DROPS and recreates every table, so this profile must never share
# a database with another profile. Without this override it would inherit `grafiosch`
# from application.properties - which is how that database once ended up with a stale,
# Flyway-less schema that made a profile-less start fail. Throwaway database:
#   CREATE DATABASE grafiosch_schemagen;
#   GRANT ALL PRIVILEGES ON grafiosch_schemagen.* TO 'grafiosch'@'localhost';
spring.datasource.url=jdbc:mariadb://localhost/grafiosch_schemagen

spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

spring.flyway.enabled=false
spring.main.web-application-type=none
