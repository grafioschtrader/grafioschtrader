<div
  (click)="onComponentClick($event)"
  [class]="{'active-border': isActivated(), 'passiv-border': !isActivated()}"
  dynamicItems>
  <p-tree
    (keydown)="onKeydown($event)"
    (onNodeContextMenuSelect)="onNodeContextMenuSelect($event)"
    (onNodeSelect)="onNodeSelect($event)"
    [(selection)]="selectedNode"
    [contextMenu]="cm"
    [value]="portfolioTrees()"
    selectionMode="single">
    <ng-template let-node pTemplate="default">
      <span (dragover)="dragOver($event, node)" (dragenter)="dragOver($event, node)" (drop)="drop($event, node)">
        {{node.label}}
      </span>
    </ng-template>
  </p-tree>
  <!-- Context menu is always visible -->
  <p-contextMenu #cm [model]="contextMenuItems()" />
</div>

<p-confirmDialog #cd header="Confirmation" icon="fa fa-question-circle" width="425">
  <p-footer>
    <button pButton (click)="cd.onAccept()">
      <i class="pi pi-check" pButtonIcon></i>
      {{'YES' | translate}}
    </button>
    <button pButton (click)="cd.onReject()">
      <i class="pi pi-times" pButtonIcon></i>
      {{'NO' | translate}}
    </button>
  </p-footer>
</p-confirmDialog>
