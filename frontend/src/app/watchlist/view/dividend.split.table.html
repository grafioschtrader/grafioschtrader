<configurable-table
  [data]="data()"
  [fields]="fields"
  [fieldsRevision]="fieldsRevision()"
  [dataKey]="keyfield"
  [multiSortMeta]="multiSortMeta"
  [paginator]="true"
  [rows]="20"
  selectionMode="single"
  sortMode="multiple"
  [valueGetterFn]="valueGetter"
  [customSortFn]="customSorter"
  [baseLocale]="baseLocale"
  customClass="datatable nestedtable leftRight2Table"
  (pageChange)="onPage($event)">
  <div caption class="table-header">
    <h5>{{groupTitle | translate}}</h5>
  </div>
  <ng-template #iconCell let-value="value">
    <svg-icon [name]="value" [svgStyle]="{ 'width.px':14, 'height.px':14 }" />
  </ng-template>
</configurable-table>
